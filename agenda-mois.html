<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agenda Mensuel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handlee&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ─── Variables (écrasées par JS selon le mois) ─── */
:root {
  --accent: #9B7FCC;
  --pastel: #EDE5FF;
  --text:   #444;
  --border: 1.5px solid var(--accent);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: #f3f3f3;
  padding: 20px;
}

/* ─── Contrôles ─── */
.controls {
  width: 297mm;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.controls button {
  border: none;
  border-radius: 12px;
  padding: 10px 20px;
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-weight: 600;
  font-family: inherit;
  font-size: 14px;
}

.controls .info {
  font-size: 13px;
  color: #888;
}

/* ════════════════════════════════
   PAGE A4 PAYSAGE = 2 × A5 portrait
════════════════════════════════ */
.page {
  width: 297mm;
  height: 210mm;
  background: white;
  margin: 0 auto;
  display: flex;
  overflow: hidden;
  position: relative; /* ← nécessaire pour les traits de coupe en absolute */
}

/* ─── Chaque moitié = A5 portrait ─── */
.half {
  width: 148.5mm;
  height: 210mm;
  padding: 8mm 9mm;
  display: flex;
  flex-direction: column;
}

/* Séparateur central */
.half-left {
  border-right: 1px dashed rgba(0,0,0,0.12);
}


/* ════════════════════════════════
   MOITIÉ GAUCHE — CALENDRIER
════════════════════════════════ */
.month-title {
  font-family: 'Handlee', cursive;
  font-size: 22px;
  color: var(--accent);
  text-align: center;
  letter-spacing: 1px;
  margin-bottom: 5mm;
  flex-shrink: 0;
}

.cal-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 22px repeat(7, 1fr);
  grid-auto-rows: auto;
  gap: 2px;
  overflow: hidden;
}

.cal-col-header {
  font-family: 'Handlee', cursive;
  font-size: 9px;
  color: var(--accent);
  text-align: center;
  padding: 2px 0 4px;
}

.cal-week-num {
  font-size: 11px;
  font-weight: 700;
  font-family: 'Handlee', cursive;
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding-right: 2px;
  opacity: 0.85;
}

.day-cell {
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 5px;
  padding: 2px 3px;
  background: white;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.day-cell.empty   { background: transparent; border-color: transparent; }
.day-cell.weekend { background: var(--pastel); border-color: rgba(0,0,0,0.05); }

.day-cell.ferie {
  background: white;
  border: 2px solid var(--accent);
}
.day-cell.ferie .day-num  { color: var(--accent); }
.day-cell.ferie .ferie-lbl { color: var(--accent); }

.day-cell.vacance { border-color: var(--accent); }
.day-cell.vacance .day-num { font-style: italic; }

.day-num {
  font-family: 'Handlee', cursive;
  font-size: 14px;
  color: var(--accent);
  line-height: 1;
}

.ferie-lbl {
  font-size: 5.5px;
  color: var(--accent);
  margin-top: 1px;
  line-height: 1.2;
}


/* ════════════════════════════════
   MOITIÉ DROITE — NOTES
════════════════════════════════ */
.notes-header {
  font-family: 'Handlee', cursive;
  font-size: 22px;
  color: var(--accent);
  text-align: center;
  letter-spacing: 1px;
  margin-bottom: 4mm;
  flex-shrink: 0;
}

.notes-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}

.notes-cols {
  flex: 1;
  display: flex;
  gap: 6px;
  overflow: hidden;
}

.notes-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.bloc {
  border: var(--border);
  border-radius: 12px;
  padding: 5px 7px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.bloc-title {
  font-family: 'Handlee', cursive;
  font-size: 12px;
  color: var(--accent);
  text-align: center;
  margin-bottom: 3px;
  flex-shrink: 0;
}

.bloc-lines {
  flex: 1;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 27px,
    rgba(0,0,0,0.07) 28px
  );
}

.bloc-notes {
  flex-shrink: 0;
  height: 28%;
  background: var(--pastel);
  border-radius: 14px;
  padding: 6px 8px;
}

.bloc-notes .bloc-title {
  font-size: 13px;
}

.bloc-notes .bloc-lines {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 29px,
    rgba(0,0,0,0.08) 30px
  );
}

.col-left .bloc  { flex: 1; }
.col-right .bloc { flex: 1; }


/* ════════════════════════════════
   GABARIT SEMAINE (repris tel quel d'agenda.html,
   utilisé quand "Semaines du mois" est coché)
════════════════════════════════ */
.left-page {
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: 100%;
  border-right: 1px dashed rgba(0,0,0,0.12);
}

.top-section { height: 24%; display: flex; gap: 8px; }
.calendar-block { width: 35%; }
.semaine-block  { width: 65%; }

.middle-section { height: 46%; display: flex; gap: 8px; }
.todo-block { width: 35%; }
.themes-block { width: 65%; display: flex; flex-direction: column; gap: 8px; }
.theme-box { flex: 1; }

.bottom-section { height: 30%; }
.pensees { height: 100%; background: var(--pastel); border-radius: 20px; padding: 12px; }

.block {
  border: var(--border);
  border-radius: 16px;
  padding: 8px;
  background: white;
}
.block-title {
  font-family: 'Handlee', cursive;
  color: var(--accent);
  text-align: center;
  font-size: 22px;
}
.small-title { font-size: 18px; margin-bottom: 2px; }

.write-lines, .day-content {
  background-image: repeating-linear-gradient(
    to bottom, transparent, transparent 23px, rgba(0,0,0,0.08) 24px
  );
}
.write-lines { height: calc(100% - 28px); }

.todo-lines {
  display: flex; flex-direction: column; justify-content: space-between;
  height: calc(100% - 28px); margin-top: 4px; padding-bottom: 12px;
}
.todo-line { display: flex; align-items: center; gap: 8px; font-size: 12px; min-height: 16px; }
.checkbox { width: 14px; height: 14px; border: var(--border); border-radius: 4px; flex-shrink: 0; }

.right-page {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
  height: 100%;
}
.day-block { display: flex; flex-direction: column; }
.day-header {
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'Handlee', cursive; color: var(--accent); font-size: 22px; margin-bottom: 4px;
}
.day-ferie-lbl {
  font-size: 10px; font-family: 'Handlee', cursive; color: var(--accent);
  opacity: 0.65; font-style: italic; flex: 1; text-align: center;
}
.day-content { flex: 1; }

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  font-size: 9px;
  text-align: center;
}
.calendar div { padding: 2px; border-radius: 6px; }
.calendar .dow { font-weight: 600; color: var(--accent); font-size: 8px; padding: 3px 0; }
.calendar .week-num {
  color: var(--accent); font-weight: 700; font-size: 8px; text-align: center;
  opacity: 0.85; padding: 2px 1px; white-space: nowrap;
}
.calendar .weekday-last { border-right: 1.5px solid var(--accent); opacity: 0.9; }
.calendar .active-week { background: var(--pastel); font-weight: bold; }
.calendar .jour-ferie { background: var(--accent); color: white; font-weight: 700; border-radius: 4px; }
.calendar .vacance { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; font-style: italic; }


/* ─── Format B6 ─── */
body.fmt-b6 .page {
  transform-origin: top left;
}

/* ─── Impression ─── */
@media print {
  body { background: white; padding: 0; }
  .controls { display: none; }
  .page { margin: 0; page-break-after: always; }
  @page { size: A4 landscape; margin: 0; }
}
</style>
</head>

<body>

<div class="controls">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div>
      <label>Mois :</label><br>
      <input type="month" id="moisPicker" style="padding:9px 14px;border-radius:12px;border:1px solid #ccc;font-family:inherit;font-size:14px;">
    </div>
    <div>
      <label>Zone :</label><br>
      <select id="zonePicker" style="padding:9px 14px;border-radius:12px;border:1px solid #ccc;font-family:inherit;font-size:14px;">
        <option value="none">— Aucune —</option>
        <option value="A" selected>Zone A</option>
        <option value="B">Zone B</option>
        <option value="C">Zone C</option>
      </select>
    </div>
    <div>
      <label>Format :</label><br>
      <select id="formatPicker" onchange="applyFormat()" style="padding:9px 14px;border-radius:12px;border:1px solid #ccc;font-family:inherit;font-size:14px;">
        <option value="A5">A5</option>
        <option value="B6">B6 (rogner)</option>
      </select>
    </div>
    <div style="padding-top:22px;display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="semainesCheck" style="width:16px;height:16px;">
      <label for="semainesCheck" style="font-size:13px;">Semaines du mois</label>
    </div>
    <div style="padding-top:22px;display:flex;gap:8px;">
      <button onclick="window.print()">🖨️ Imprimer</button>
      <button onclick="ouvrirAgenda()" style="background:#aaa;">📋 Vue hebdo</button>
    </div>
  </div>

  <!-- Titres des blocs -->
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;align-items:center;">
    <span style="font-size:12px;color:#888;font-weight:600;">Titres des blocs :</span>
    <input type="text" id="titreB1" placeholder="Films"    oninput="saveTitresMois()" style="width:90px;padding:5px 8px;border-radius:8px;border:1px solid #ccc;font-family:inherit;font-size:12px;">
    <input type="text" id="titreB2" placeholder="Livres"   oninput="saveTitresMois()" style="width:90px;padding:5px 8px;border-radius:8px;border:1px solid #ccc;font-family:inherit;font-size:12px;">
    <input type="text" id="titreB3" placeholder="Jeux"     oninput="saveTitresMois()" style="width:90px;padding:5px 8px;border-radius:8px;border:1px solid #ccc;font-family:inherit;font-size:12px;">
    <input type="text" id="titreB4" placeholder="Médical"  oninput="saveTitresMois()" style="width:90px;padding:5px 8px;border-radius:8px;border:1px solid #ccc;font-family:inherit;font-size:12px;">
    <input type="text" id="titreB5" placeholder="Dépenses" oninput="saveTitresMois()" style="width:90px;padding:5px 8px;border-radius:8px;border:1px solid #ccc;font-family:inherit;font-size:12px;">
  </div>
</div>

<div class="page" id="mainPage">

  <!-- ══ MOITIÉ GAUCHE : CALENDRIER ══ -->
  <div class="half half-left">
    <div class="month-title" id="monthTitle"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- ══ MOITIÉ DROITE : NOTES ══ -->
  <div class="half half-right">
    <div class="notes-header" id="notesHeader"></div>

    <div class="notes-body">

      <div class="notes-cols">

        <!-- Col gauche : Films · Livres · Jeux -->
        <div class="notes-col col-left">
          <div class="bloc">
            <div class="bloc-title" id="labelB1">🎬 Films</div>
            <div class="bloc-lines"></div>
          </div>
          <div class="bloc">
            <div class="bloc-title" id="labelB2">📚 Livres</div>
            <div class="bloc-lines"></div>
          </div>
          <div class="bloc">
            <div class="bloc-title" id="labelB3">🎮 Jeux</div>
            <div class="bloc-lines"></div>
          </div>
        </div>

        <!-- Col droite : Médical · Dépenses -->
        <div class="notes-col col-right">
          <div class="bloc">
            <div class="bloc-title" id="labelB4">🏥 Médical</div>
          </div>
          <div class="bloc">
            <div class="bloc-title" id="labelB5">💸 Dépenses</div>
          </div>
        </div>

      </div>

      <!-- Bas : grand bloc Notes -->
      <div class="bloc bloc-notes">
        <div class="bloc-title">Notes</div>
        <div class="bloc-lines"></div>
      </div>

    </div>
  </div>


</div>

<div id="weeksContainer"></div>


<script>
/* ════════════════════════════════
   PALETTES PAR MOIS
════════════════════════════════ */
const THEMES = [
  { accent: "#7FB8E0", pastel: "#EBF5FF" }, // Janvier
  { accent: "#89A8D5", pastel: "#E6EEFF" }, // Février
  { accent: "#7DC4A0", pastel: "#EDFAF3" }, // Mars
  { accent: "#5FAF82", pastel: "#E6F7EE" }, // Avril
  { accent: "#A8D5BA", pastel: "#EEF9F1" }, // Mai
  { accent: "#E07FAF", pastel: "#FFF0F6" }, // Juin
  { accent: "#F4A7C3", pastel: "#FFF4F8" }, // Juillet
  { accent: "#D9A8D0", pastel: "#FCEEFF" }, // Août
  { accent: "#B8A1D9", pastel: "#F3ECFF" }, // Septembre
  { accent: "#9B7FCC", pastel: "#EDE5FF" }, // Octobre
  { accent: "#5B9BD5", pastel: "#E6F2FF" }, // Novembre
  { accent: "#89C4C4", pastel: "#E8F9F9" }, // Décembre
];

const MONTHS_FR = [
  "Janvier","Février","Mars","Avril","Mai","Juin",
  "Juillet","Août","Septembre","Octobre","Novembre","Décembre"
];

const DAYS_SHORT = ["L","M","M","J","V","S","D"];


/* ─── Initialisation depuis URL ou date courante ─── */
const urlParams  = new URLSearchParams(window.location.search);
const moisParam  = urlParams.get("mois") || (() => {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
})();
const zoneParam  = urlParams.get("zone") || "A";

document.getElementById("moisPicker").value  = moisParam;
document.getElementById("zonePicker").value  = zoneParam;

function getParams() {
  const mois = document.getElementById("moisPicker").value || moisParam;
  const z    = document.getElementById("zonePicker").value;
  const [y, m] = mois.split("-");
  return { mois, zone: z, year: parseInt(y), month: parseInt(m) - 1 };
}

function applyThemeAndTitles() {
  const { year, month } = getParams();
  const theme = THEMES[month];
  document.documentElement.style.setProperty("--accent", theme.accent);
  document.documentElement.style.setProperty("--pastel", theme.pastel);
  document.documentElement.style.setProperty("--border", `1.5px solid ${theme.accent}`);
  const label = `${MONTHS_FR[month]} ${year}`;
  document.getElementById("monthTitle").textContent  = label;
  document.getElementById("notesHeader").textContent = label;
}

applyThemeAndTitles();

document.getElementById("moisPicker").addEventListener("change", () => {
  applyThemeAndTitles();
  buildCalendar();
  buildWeeks();
});
document.getElementById("zonePicker").addEventListener("change", () => {
  buildCalendar();
  buildWeeks();
});


/* ════════════════════════════════
   UTILITAIRES DATES
════════════════════════════════ */
function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d-w1)/86400000 - 3 + (w1.getDay()+6)%7)/7);
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}


/* ════════════════════════════════
   JOURS FÉRIÉS
════════════════════════════════ */
function easterSunday(y) {
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  return new Date(y, Math.floor((h+l-7*m+114)/31)-1, ((h+l-7*m+114)%31)+1);
}

function getHolidayMap(y) {
  const e   = easterSunday(y);
  const add = (dt,n) => { const d=new Date(dt); d.setDate(d.getDate()+n); return d; };
  const k   = d => dateKey(d);
  const map = new Map();
  map.set(`${y}-01-01`, "Jour de l'An");
  map.set(k(add(e,1)),  "Lundi de Pâques");
  map.set(`${y}-05-01`, "Fête du Travail");
  map.set(`${y}-05-08`, "Victoire 1945");
  map.set(k(add(e,39)), "Ascension");
  map.set(k(add(e,50)), "Lundi de Pentecôte");
  map.set(`${y}-07-14`, "Fête nationale");
  map.set(`${y}-08-15`, "Assomption");
  map.set(`${y}-11-01`, "Toussaint");
  map.set(`${y}-11-11`, "Armistice");
  map.set(`${y}-12-25`, "Noël");
  return map;
}

function getHolidays(y) {
  const e   = easterSunday(y);
  const add = (dt,n) => { const d=new Date(dt); d.setDate(d.getDate()+n); return d; };
  const k   = d => dateKey(d);
  const map = new Map();
  map.set(`${y}-01-01`, "Jour de l'An");
  map.set(k(add(e,1)),  "Lundi de Pâques");
  map.set(`${y}-05-01`, "Fête du Travail");
  map.set(`${y}-05-08`, "Victoire 1945");
  map.set(k(add(e,39)), "Ascension");
  map.set(k(add(e,50)), "Lundi de Pentecôte");
  map.set(`${y}-07-14`, "Fête nationale");
  map.set(`${y}-08-15`, "Assomption");
  map.set(`${y}-11-01`, "Toussaint");
  map.set(`${y}-11-11`, "Armistice");
  map.set(`${y}-12-25`, "Noël");
  return map;
}


/* ════════════════════════════════
   VACANCES SCOLAIRES — API
════════════════════════════════ */
async function fetchVacances(z) {
  if (z === "none") return [];
  const from = new Date();
  from.setFullYear(from.getFullYear() - 1);
  const fromStr = from.toISOString().substring(0, 10) + "T00:00:00+01:00";
  const params = new URLSearchParams({
    where:    `zones="Zone ${z}" and population="Élèves" and end_date>="${fromStr}"`,
    select:   "start_date,end_date",
    limit:    50,
    timezone: "Europe/Paris"
  });
  const url = `https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records?${params}`;
  try {
    const res  = await fetch(url);
    const json = await res.json();
    return (json.results || []).map(r => [
      r.start_date.substring(0,10),
      r.end_date.substring(0,10)
    ]);
  } catch(e) {
    console.warn("API vacances inaccessible", e);
    return [];
  }
}

function isVacance(dk, ranges) {
  return ranges.some(([s,e]) => dk >= s && dk <= e);
}


/* ════════════════════════════════
   CONSTRUCTION DU CALENDRIER
════════════════════════════════ */
async function buildCalendar() {
  const { year, month, zone } = getParams();
  const holidayMap = new Map([...getHolidays(year), ...getHolidays(year+1)]);
  const vacRanges  = await fetchVacances(zone);
  const grid      = document.getElementById("calGrid");
  grid.innerHTML  = "";

  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month+1, 0).getDate();
  const startDow = (firstDay.getDay()+6) % 7;
  const nbRows   = Math.ceil((startDow + lastDay) / 7);

  grid.style.gridTemplateRows = `auto repeat(${nbRows}, 1fr)`;

  /* En-têtes colonnes */
  grid.appendChild(document.createElement("div"));
  DAYS_SHORT.forEach(d => {
    const h = document.createElement("div");
    h.className   = "cal-col-header";
    h.textContent = d;
    grid.appendChild(h);
  });

  /* Lignes semaine */
  for (let row = 0; row < nbRows; row++) {
    const rowStart = row * 7 - startDow + 1;
    const refDate  = new Date(year, month, Math.max(1, rowStart));
    const wn       = document.createElement("div");
    wn.className   = "cal-week-num";
    wn.textContent = getISOWeek(refDate);
    grid.appendChild(wn);

    for (let col = 0; col < 7; col++) {
      const cellDay = row * 7 + col - startDow + 1;
      const cell    = document.createElement("div");

      if (cellDay < 1 || cellDay > lastDay) {
        cell.className = "day-cell empty";
      } else {
        const date  = new Date(year, month, cellDay);
        const dk    = dateKey(date);
        const isWE  = col >= 5;
        const isFer = holidayMap.has(dk);
        const isVac = !isFer && isVacance(dk, vacRanges);

        cell.className = "day-cell"
          + (isFer            ? " ferie"   : "")
          + (isVac            ? " vacance" : "")
          + (!isFer && isWE   ? " weekend" : "");

        const num = document.createElement("div");
        num.className   = "day-num";
        num.textContent = cellDay;
        cell.appendChild(num);

        if (isFer) {
          const lbl = document.createElement("div");
          lbl.className   = "ferie-lbl";
          lbl.textContent = holidayMap.get(dk);
          cell.appendChild(lbl);
        }
      }

      grid.appendChild(cell);
    }
  }
}

/* Semaines "appartenant" au mois : règle du jeudi majoritaire (cf. agenda.html) */
function weeksOfMonth(year, month) {
  let monday = new Date(year, month, 1);
  monday.setDate(monday.getDate() - (monday.getDay()+6)%7);
  const weeks = [];
  let guard = 0;
  while (guard++ < 10) {
    const thursday = new Date(monday);
    thursday.setDate(thursday.getDate() + 3);
    if (thursday.getFullYear() === year && thursday.getMonth() === month) {
      weeks.push(new Date(monday));
      monday = new Date(monday);
      monday.setDate(monday.getDate() + 7);
    } else if (weeks.length === 0) {
      monday.setDate(monday.getDate() + 7);
    } else {
      break;
    }
  }
  return weeks;
}

function buildWeekPage(monday, zone, vacRanges) {
  const isoWeek = getISOWeek(monday);
  const theme = WEEK_THEMES[isoWeek] || WEEK_THEMES[1];

  const page = document.createElement("div");
  page.className = "page";
  page.style.setProperty("--accent", theme.accent);
  page.style.setProperty("--pastel", theme.pastel);
  page.style.setProperty("--border", "1.5px solid " + theme.accent);

  const titre1 = localStorage.getItem("bloc_titre1") || "Orga";
  const titre2 = localStorage.getItem("bloc_titre2") || "Équipe";

  page.innerHTML = `
    <div class="half left-page">
      <div class="top-section">
        <div class="block calendar-block">
          <div class="block-title"></div>
          <div class="calendar"></div>
        </div>
        <div class="block semaine-block">
          <div class="block-title"></div>
          <div class="write-lines"></div>
        </div>
      </div>
      <div class="middle-section">
        <div class="block todo-block">
          <div class="block-title">Todo</div>
          <div class="todo-lines">${Array.from({length:8}).map(() => `<div class="todo-line"><div class="checkbox"></div><div></div></div>`).join("")}</div>
        </div>
        <div class="themes-block">
          <div class="block theme-box"><div class="block-title small-title">${titre1}</div><div class="write-lines"></div></div>
          <div class="block theme-box"><div class="block-title small-title">${titre2}</div><div class="write-lines"></div></div>
        </div>
      </div>
      <div class="bottom-section">
        <div class="pensees"><div class="block-title">Pensées</div><div class="pensees-lines write-lines"></div></div>
      </div>
    </div>
    <div class="half right-page"></div>`;

  /* Mini calendrier (mois du jeudi de la semaine) */
  const thursday = new Date(monday);
  thursday.setDate(thursday.getDate() + 3);
  const year  = thursday.getFullYear();
  const month = thursday.getMonth();
  const lastDay  = new Date(year, month + 1, 0);
  const startDay = (new Date(year, month, 1).getDay() + 6) % 7;
  const holidayMap = new Map([...getHolidayMap(year), ...getHolidayMap(year+1)]);

  page.querySelectorAll(".block-title")[0].textContent = MONTHS_FR[month];
  page.querySelectorAll(".block-title")[1].textContent = `Semaine ${isoWeek} ${thursday.getFullYear()}`;

  const cal = page.querySelector(".calendar");
  cal.style.gridTemplateColumns = "min-content repeat(7, 1fr)";
  const emptyHeader = document.createElement("div");
  emptyHeader.innerHTML = "&nbsp;";
  cal.appendChild(emptyHeader);
  DAYS_SHORT.forEach((d, i) => {
    const h = document.createElement("div");
    h.className = "dow" + (i === 4 ? " weekday-last" : "");
    h.textContent = d;
    cal.appendChild(h);
  });

  let day = 1 - startDay;
  while (day <= lastDay.getDate()) {
    const refDay  = day < 1 ? 1 : day;
    const wNum = document.createElement("div");
    wNum.className = "week-num";
    wNum.textContent = getISOWeek(new Date(year, month, refDay));
    cal.appendChild(wNum);
    for (let col = 0; col < 7; col++, day++) {
      const div = document.createElement("div");
      if (day < 1 || day > lastDay.getDate()) {
        div.innerHTML = "&nbsp;";
      } else {
        const current = new Date(year, month, day);
        const dk = dateKey(current);
        div.textContent = day;
        if (getISOWeek(current) === isoWeek) div.classList.add("active-week");
        if (col === 4) div.classList.add("weekday-last");
        if (holidayMap.has(dk)) {
          div.classList.add("jour-ferie");
        } else if (zone !== 'none' && isVacance(dk, vacRanges)) {
          div.classList.add("vacance");
        }
      }
      cal.appendChild(div);
    }
  }

  /* Blocs jours */
  const daysContainer = page.querySelector(".right-page");
  DAY_NAMES.forEach((name, i) => {
    const block = document.createElement("div");
    block.className = "block day-block";

    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    let dateLabel, ferieLabel = "";
    if (i === 5) {
      const sun = new Date(monday); sun.setDate(sun.getDate() + 6);
      dateLabel = `${d.getDate()} - ${sun.getDate()}/${sun.getMonth() + 1}`;
    } else {
      dateLabel = `${d.getDate()}/${d.getMonth() + 1}`;
      const dk = dateKey(d);
      const hols = new Map([...getHolidayMap(d.getFullYear()), ...getHolidayMap(d.getFullYear()+1)]);
      if (hols.has(dk)) ferieLabel = hols.get(dk);
    }

    block.innerHTML = `
      <div class="day-header">
        <span class="day-name">${name}</span>
        <span class="day-ferie-lbl">${ferieLabel}</span>
        <span class="date">${dateLabel}</span>
      </div>
      <div class="day-content"></div>`;
    daysContainer.appendChild(block);
  });

  return page;
}

async function buildWeeks() {
  const container = document.getElementById("weeksContainer");
  container.innerHTML = "";
  if (!document.getElementById("semainesCheck").checked) return;

  const { year, month, zone } = getParams();
  const vacRanges = zone !== 'none' ? await fetchVacances(zone) : [];
  const weeks = weeksOfMonth(year, month);
  weeks.forEach(monday => {
    container.appendChild(buildWeekPage(monday, zone, vacRanges));
  });
}

document.getElementById("semainesCheck").addEventListener("change", buildWeeks);

/* ─── Navigation vers vue hebdomadaire ─── */
function ouvrirAgenda() {
  const { mois, zone } = getParams();
  const d = new Date(mois + "-01");
  const yr = d.getFullYear();
  const wk = String(getISOWeek(d)).padStart(2, "0");
  window.open(`agenda.html?week=${yr}-W${wk}&zone=${zone}`, "_blank");
}


/* ════════════════════════════════
   FORMAT A5 / B6
════════════════════════════════ */
function applyFormat() {
  const fmt  = document.getElementById("formatPicker").value;
  const page = document.getElementById("mainPage");

  if (fmt === "B6") {
    document.body.classList.add("fmt-b6");
    const scale = Math.min(250 / 297, 176 / 210);
    page.style.transform       = `scale(${scale})`;
    page.style.transformOrigin = "top left";
    page.parentElement.style.paddingBottom = (page.offsetHeight * (1 - scale)) + "px";
  } else {
    document.body.classList.remove("fmt-b6");
    page.style.transform       = "";
    page.style.transformOrigin = "";
    page.parentElement.style.paddingBottom = "";
  }
}

applyFormat();

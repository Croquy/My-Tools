<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Carnet du mois</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handlee&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   Variables + base (identique à agenda.html / agenda-mois.html)
═══════════════════════════════════════════ */
:root {
  --accent: #B8A1D9;
  --pastel: #F3ECFF;
  --text: #444;
  --border: 1.5px solid var(--accent);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f3f3f3;
  font-family: 'Inter', sans-serif;
  color: var(--text);
}

.controls {
  width: 297mm;
  margin: auto auto 20px;
  background: white;
  border-radius: 18px;
  padding: 16px;
  border: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.controls select, .controls input {
  padding: 9px 14px;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-family: inherit;
  font-size: 14px;
}

.controls button {
  border: none;
  border-radius: 12px;
  padding: 10px 18px;
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-weight: 600;
}

.controls .info { font-size: 12px; color: #888; flex-basis: 100%; line-height: 1.5; }

/* ─── Chaque page = une feuille A4 standard, une par une (l'imprimante
   se charge ensuite de la réduire / mettre plusieurs par feuille) ─── */
.page {
  width: 210mm;
  height: 297mm;
  background: white;
  margin: 0 auto 6mm;
  padding: 14mm;
  overflow: hidden;
  position: relative;
}

.block {
  border: var(--border);
  border-radius: 16px;
  padding: 8px;
  background: white;
}

.block-title {
  font-family: 'Handlee', cursive;
  color: var(--accent);
  text-align: center;
  font-size: 22px;
}

.small-title { font-size: 18px; margin-bottom: 2px; }

/* ══════════════════════════════════════
   GABARIT SEMAINE (repris d'agenda.html)
══════════════════════════════════════ */
.left-page {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.top-section { height: 17%; display: flex; gap: 8px; }
.calendar-block { width: 35%; }
.semaine-block  { width: 65%; }

.middle-section { height: 53%; display: flex; gap: 8px; }
.todo-block { width: 35%; }
.themes-block { width: 65%; display: flex; flex-direction: column; gap: 8px; }
.theme-box { flex: 1; }

.bottom-section { height: 30%; }
.pensees { height: 100%; background: var(--pastel); border-radius: 20px; padding: 12px; }

.write-lines, .day-content, .pensees-lines {
  background-image: repeating-linear-gradient(
    to bottom, transparent, transparent 23px, rgba(0,0,0,0.08) 24px
  );
}
.write-lines   { height: calc(100% - 28px); }
.pensees-lines { height: calc(100% - 35px); }

.todo-lines {
  display: flex; flex-direction: column; justify-content: space-between;
  height: calc(100% - 28px); margin-top: 4px; padding-bottom: 12px;
}
.todo-line { display: flex; align-items: center; gap: 8px; font-size: 12px; min-height: 16px; }
.checkbox { width: 14px; height: 14px; border: var(--border); border-radius: 4px; flex-shrink: 0; }

.week-cal .week-num {
  color: var(--accent); font-weight: 700; font-size: 8px; text-align: center;
  opacity: 0.85; padding: 2px 1px; white-space: nowrap;
}

.right-page {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
}

.day-block { display: flex; flex-direction: column; }
.day-header {
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'Handlee', cursive; color: var(--accent); font-size: 22px; margin-bottom: 4px;
}
.day-ferie-lbl {
  font-size: 10px; font-family: 'Handlee', cursive; color: var(--accent);
  opacity: 0.65; font-style: italic; flex: 1; text-align: center;
}
.day-content { flex: 1; }

.week-cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  font-size: 9px;
  text-align: center;
}
.week-cal div { padding: 2px; border-radius: 6px; }
.week-cal .dow { font-weight: 600; color: var(--accent); font-size: 8px; padding: 3px 0; }
.week-cal .weekday-last { border-right: 1.5px solid var(--accent); opacity: 0.9; }
.week-cal .active-week { background: var(--pastel); font-weight: bold; }
.week-cal .jour-ferie { background: var(--accent); color: white; font-weight: 700; border-radius: 4px; }
.week-cal .vacance { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; font-style: italic; }

/* ══════════════════════════════════════
   GABARIT MOIS (repris d'agenda-mois.html)
══════════════════════════════════════ */
.half-left { display: flex; flex-direction: column; }
.half-right { display: flex; flex-direction: column; }

.month-title {
  font-family: 'Handlee', cursive; font-size: 22px; color: var(--accent);
  text-align: center; letter-spacing: 1px; margin-bottom: 5mm; flex-shrink: 0;
}

.cal-grid {
  flex: 1; display: grid; grid-template-columns: 22px repeat(7, 1fr);
  grid-auto-rows: auto; gap: 2px; overflow: hidden;
}
.cal-col-header { font-family: 'Handlee', cursive; font-size: 9px; color: var(--accent); text-align: center; padding: 2px 0 4px; }
.cal-week-num {
  font-size: 11px; font-weight: 700; font-family: 'Handlee', cursive; color: var(--accent);
  display: flex; align-items: center; justify-content: center; padding-right: 2px; opacity: 0.85;
}
.day-cell { border: 1px solid rgba(0,0,0,0.07); border-radius: 5px; padding: 2px 3px; background: white; min-height: 0; display: flex; flex-direction: column; }
.day-cell.empty   { background: transparent; border-color: transparent; }
.day-cell.weekend { background: var(--pastel); border-color: rgba(0,0,0,0.05); }
.day-cell.ferie   { background: white; border: 2px solid var(--accent); }
.day-cell.ferie .day-num  { color: var(--accent); }
.day-cell.ferie .ferie-lbl { color: var(--accent); }
.day-cell.vacance { border-color: var(--accent); }
.day-cell.vacance .day-num { font-style: italic; }
.day-num { font-family: 'Handlee', cursive; font-size: 14px; color: var(--accent); line-height: 1; }
.ferie-lbl { font-size: 5.5px; color: var(--accent); margin-top: 1px; line-height: 1.2; }

.notes-header {
  font-family: 'Handlee', cursive; font-size: 22px; color: var(--accent);
  text-align: center; letter-spacing: 1px; margin-bottom: 4mm; flex-shrink: 0;
}
.notes-body { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.notes-cols { flex: 1; display: flex; gap: 6px; overflow: hidden; }
.notes-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.bloc { border: var(--border); border-radius: 12px; padding: 5px 7px; display: flex; flex-direction: column; overflow: hidden; }
.bloc-title { font-family: 'Handlee', cursive; font-size: 12px; color: var(--accent); text-align: center; margin-bottom: 3px; flex-shrink: 0; }
.bloc-lines { flex: 1; background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(0,0,0,0.07) 28px); }
.bloc-notes { flex-shrink: 0; height: 28%; background: var(--pastel); border-radius: 14px; padding: 6px 8px; }
.bloc-notes .bloc-title { font-size: 13px; }
.bloc-notes .bloc-lines { background-image: repeating-linear-gradient(to bottom, transparent, transparent 29px, rgba(0,0,0,0.08) 30px); }
.col-left .bloc, .col-right .bloc { flex: 1; }

/* ─── Impression ─── */
@media print {
  body { background: white; padding: 0; }
  .controls { display: none; }
  .page { margin: 0; page-break-after: always; }
  @page { size: A4 portrait; margin: 0; }
}
</style>
</head>

<body>

<div class="controls">
  <div>
    <label>Mois :</label><br>
    <input type="month" id="moisPicker">
  </div>
  <div>
    <label>Zone :</label><br>
    <select id="zonePicker">
      <option value="none">— Aucune —</option>
      <option value="A" selected>Zone A</option>
      <option value="B">Zone B</option>
      <option value="C">Zone C</option>
    </select>
  </div>
  <div style="padding-top:22px;">
    <button onclick="window.print()">🖨️ Imprimer</button>
  </div>
  <div class="info">
    Enchaîne, pour le mois choisi : la page mensuelle habituelle, puis une page hebdomadaire
    habituelle (celle d'agenda.html) pour chaque semaine du mois — une feuille A4 par page,
    à imprimer et découper/plier comme d'habitude.
  </div>
</div>

<div id="output"></div>

<script>
/* ════════════════════════════════
   UTILITAIRES COMMUNS
════════════════════════════════ */
const MONTHS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const DAYS_SHORT = ["L","M","M","J","V","S","D"];

function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const week1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function easterSunday(year) {
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4;
  const l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31) - 1;
  const day   = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, month, day);
}

function getHolidays(year) {
  const easter = easterSunday(year);
  const add = (date, days) => { const d = new Date(date); d.setDate(d.getDate() + days); return d; };
  const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return new Set([
    `${year}-01-01`, key(add(easter, 1)), `${year}-05-01`, `${year}-05-08`,
    key(add(easter, 39)), key(add(easter, 50)), `${year}-07-14`, `${year}-08-15`,
    `${year}-11-01`, `${year}-11-11`, `${year}-12-25`,
  ]);
}

function getHolidayMap(year) {
  const easter = easterSunday(year);
  const add = (date, days) => { const d = new Date(date); d.setDate(d.getDate() + days); return d; };
  const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const map = new Map();
  map.set(`${year}-01-01`,    "Jour de l'An");
  map.set(key(add(easter,1)), "Lundi de Pâques");
  map.set(`${year}-05-01`,    "Fête du Travail");
  map.set(`${year}-05-08`,    "Victoire 1945");
  map.set(key(add(easter,39)),"Ascension");
  map.set(key(add(easter,50)),"Lundi de Pentecôte");
  map.set(`${year}-07-14`,    "Fête nationale");
  map.set(`${year}-08-15`,    "Assomption");
  map.set(`${year}-11-01`,    "Toussaint");
  map.set(`${year}-11-11`,    "Armistice");
  map.set(`${year}-12-25`,    "Noël");
  return map;
}

const vacancesCache = {};
async function fetchVacances(zone) {
  if (zone === 'none') return [];
  if (vacancesCache[zone]) return vacancesCache[zone];
  const from = new Date();
  from.setFullYear(from.getFullYear() - 1);
  const fromStr = from.toISOString().substring(0, 10) + "T00:00:00+01:00";
  const params = new URLSearchParams({
    where:    `zones="Zone ${zone}" and population="Élèves" and end_date>="${fromStr}"`,
    select:   "start_date,end_date",
    limit:    50,
    timezone: "Europe/Paris"
  });
  const url = `https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records?${params}`;
  try {
    const res  = await fetch(url);
    const json = await res.json();
    const ranges = (json.results || []).map(r => [r.start_date.substring(0,10), r.end_date.substring(0,10)]);
    vacancesCache[zone] = ranges;
    return ranges;
  } catch (e) {
    console.warn("Impossible de charger les vacances scolaires :", e);
    return [];
  }
}

function isVacance(date, ranges) {
  const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  return ranges.some(([start, end]) => key >= start && key <= end);
}

/* Semaines "appartenant" au mois : règle du jeudi majoritaire (cf. agenda.html) */
function weeksOfMonth(year, month) {
  let monday = new Date(year, month, 1);
  monday.setDate(monday.getDate() - (monday.getDay()+6)%7);
  const weeks = [];
  let guard = 0;
  while (guard++ < 10) {
    const thursday = new Date(monday);
    thursday.setDate(thursday.getDate() + 3);
    if (thursday.getFullYear() === year && thursday.getMonth() === month) {
      weeks.push(new Date(monday));
      monday = new Date(monday);
      monday.setDate(monday.getDate() + 7);
    } else if (weeks.length === 0) {
      monday.setDate(monday.getDate() + 7);
    } else {
      break;
    }
  }
  return weeks;
}

/* ════════════════════════════════
   THÈMES COULEUR (repris d'agenda.html / agenda-mois.html)
════════════════════════════════ */
const WEEK_THEMES = [
  null,
  { accent: "#7FB7DF", pastel: "#E7EEF3" }, { accent: "#81B3DD", pastel: "#E7EDF2" },
  { accent: "#83B0DB", pastel: "#E7EDF2" }, { accent: "#85ACD8", pastel: "#E8ECF2" },
  { accent: "#87A9D6", pastel: "#E8ECF1" }, { accent: "#87ADD3", pastel: "#E8EDF1" },
  { accent: "#85BCD0", pastel: "#E8EFF1" }, { accent: "#82CACC", pastel: "#E8F1F1" },
  { accent: "#80C8B9", pastel: "#E9F1EF" }, { accent: "#7DC5A5", pastel: "#E9F0ED" },
  { accent: "#78C09B", pastel: "#E9F0ED" }, { accent: "#71BC94", pastel: "#E9F0EC" },
  { accent: "#6BB78E", pastel: "#E9F0EC" }, { accent: "#64B387", pastel: "#E9F0EC" },
  { accent: "#60AF83", pastel: "#E9F0EC" }, { accent: "#70B88E", pastel: "#E9F0EC" },
  { accent: "#7FC09A", pastel: "#E9F0EC" }, { accent: "#8FC8A7", pastel: "#E9F0EC" },
  { accent: "#9FD0B3", pastel: "#E9F0EC" }, { accent: "#A4D5AA", pastel: "#E9F0EA" },
  { accent: "#BAD79B", pastel: "#EDF1E8" }, { accent: "#D9D093", pastel: "#F1F0E8" },
  { accent: "#DC9E8A", pastel: "#F2EAE7" }, { accent: "#DF80A4", pastel: "#F3E7EB" },
  { accent: "#E485B2", pastel: "#F3E6EC" }, { accent: "#E98DB6", pastel: "#F3E6EC" },
  { accent: "#ED96BA", pastel: "#F4E6EB" }, { accent: "#F19FBE", pastel: "#F4E5EB" },
  { accent: "#F3A6C3", pastel: "#F4E5EB" }, { accent: "#EEA6C8", pastel: "#F3E6EC" },
  { accent: "#E8A6CC", pastel: "#F3E7EE" }, { accent: "#E2A6CF", pastel: "#F2E8EE" },
  { accent: "#DCA7D0", pastel: "#F1E8EF" }, { accent: "#D8A7D4", pastel: "#F1E9F0" },
  { accent: "#D5A5D8", pastel: "#F0E9F1" }, { accent: "#CCA4D8", pastel: "#EFE9F1" },
  { accent: "#C2A2D8", pastel: "#EDE9F1" }, { accent: "#B8A1D8", pastel: "#ECE8F1" },
  { accent: "#B29AD6", pastel: "#ECE8F1" }, { accent: "#AC93D3", pastel: "#ECE8F1" },
  { accent: "#A68BD0", pastel: "#ECE8F1" }, { accent: "#9F84CE", pastel: "#ECE8F1" },
  { accent: "#957DCC", pastel: "#EBE8F1" }, { accent: "#8075CE", pastel: "#E9E8F1" },
  { accent: "#6D74CF", pastel: "#E8E8F2" }, { accent: "#6682D1", pastel: "#E7EAF2" },
  { accent: "#5D93D4", pastel: "#E7ECF2" }, { accent: "#61A4D2", pastel: "#E7EEF2" },
  { accent: "#6CAFCE", pastel: "#E8EFF2" }, { accent: "#76B9CA", pastel: "#E8EFF1" },
  { accent: "#7FBFC7", pastel: "#E9F0F0" }, { accent: "#89C3C4", pastel: "#E9F0F0" },
];

const MONTH_THEMES = [
  { accent: "#7FB8E0", pastel: "#EBF5FF" }, { accent: "#89A8D5", pastel: "#E6EEFF" },
  { accent: "#7DC4A0", pastel: "#EDFAF3" }, { accent: "#5FAF82", pastel: "#E6F7EE" },
  { accent: "#A8D5BA", pastel: "#EEF9F1" }, { accent: "#E07FAF", pastel: "#FFF0F6" },
  { accent: "#F4A7C3", pastel: "#FFF4F8" }, { accent: "#D9A8D0", pastel: "#FCEEFF" },
  { accent: "#B8A1D9", pastel: "#F3ECFF" }, { accent: "#9B7FCC", pastel: "#EDE5FF" },
  { accent: "#5B9BD5", pastel: "#E6F2FF" }, { accent: "#89C4C4", pastel: "#E8F9F9" },
];

function applyWeekTheme(pageEl, isoWeek) {
  const theme = WEEK_THEMES[isoWeek] || WEEK_THEMES[1];
  pageEl.style.setProperty('--accent', theme.accent);
  pageEl.style.setProperty('--pastel', theme.pastel);
  pageEl.style.setProperty('--border', '1.5px solid ' + theme.accent);
}

function applyMonthTheme(pageEl, month) {
  const theme = MONTH_THEMES[month];
  pageEl.style.setProperty('--accent', theme.accent);
  pageEl.style.setProperty('--pastel', theme.pastel);
  pageEl.style.setProperty('--border', '1.5px solid ' + theme.accent);
}

/* ════════════════════════════════
   PAGE MENSUELLE (repris d'agenda-mois.html)
════════════════════════════════ */
const BLOC_DEFAULTS = ["Films","Livres","Jeux","Médical","Dépenses"];
const BLOC_ICONS    = ["🎬","📚","🎮","🏥","💸"];

function buildMonthCalendarPage(year, month, zone, holidayMap, vacRanges) {
  const page = document.createElement("div");
  page.className = "page half-left";
  applyMonthTheme(page, month);

  const label = `${MONTHS_FR[month]} ${year}`;
  page.innerHTML = `
    <div class="month-title">${label}</div>
    <div class="cal-grid"></div>`;

  const grid = page.querySelector(".cal-grid");
  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month+1, 0).getDate();
  const startDow = (firstDay.getDay()+6) % 7;
  const nbRows   = Math.ceil((startDow + lastDay) / 7);
  grid.style.gridTemplateRows = `auto repeat(${nbRows}, 1fr)`;

  grid.appendChild(document.createElement("div"));
  DAYS_SHORT.forEach(d => {
    const h = document.createElement("div");
    h.className = "cal-col-header";
    h.textContent = d;
    grid.appendChild(h);
  });

  for (let row = 0; row < nbRows; row++) {
    const rowStart = row * 7 - startDow + 1;
    const refDate  = new Date(year, month, Math.max(1, rowStart));
    const wn = document.createElement("div");
    wn.className = "cal-week-num";
    wn.textContent = getISOWeek(refDate);
    grid.appendChild(wn);

    for (let col = 0; col < 7; col++) {
      const cellDay = row * 7 + col - startDow + 1;
      const cell = document.createElement("div");
      if (cellDay < 1 || cellDay > lastDay) {
        cell.className = "day-cell empty";
      } else {
        const date = new Date(year, month, cellDay);
        const dk   = dateKey(year, month, cellDay);
        const isWE = col >= 5;
        const isFer = holidayMap.has(dk);
        const isVac = !isFer && zone !== 'none' && isVacance(date, vacRanges);
        cell.className = "day-cell" + (isFer ? " ferie" : "") + (isVac ? " vacance" : "") + (!isFer && isWE ? " weekend" : "");
        const num = document.createElement("div");
        num.className = "day-num";
        num.textContent = cellDay;
        cell.appendChild(num);
        if (isFer) {
          const lbl = document.createElement("div");
          lbl.className = "ferie-lbl";
          lbl.textContent = holidayMap.get(dk);
          cell.appendChild(lbl);
        }
      }
      grid.appendChild(cell);
    }
  }

  return page;
}

function buildMonthNotesPage(year, month) {
  const page = document.createElement("div");
  page.className = "page half-right";
  applyMonthTheme(page, month);

  const label = `${MONTHS_FR[month]} ${year}`;
  page.innerHTML = `
    <div class="notes-header">${label}</div>
    <div class="notes-body">
      <div class="notes-cols">
        <div class="notes-col col-left">
          <div class="bloc"><div class="bloc-title">${BLOC_ICONS[0]} ${localStorage.getItem("mois_titre1")||BLOC_DEFAULTS[0]}</div><div class="bloc-lines"></div></div>
          <div class="bloc"><div class="bloc-title">${BLOC_ICONS[1]} ${localStorage.getItem("mois_titre2")||BLOC_DEFAULTS[1]}</div><div class="bloc-lines"></div></div>
          <div class="bloc"><div class="bloc-title">${BLOC_ICONS[2]} ${localStorage.getItem("mois_titre3")||BLOC_DEFAULTS[2]}</div><div class="bloc-lines"></div></div>
        </div>
        <div class="notes-col col-right">
          <div class="bloc"><div class="bloc-title">${BLOC_ICONS[3]} ${localStorage.getItem("mois_titre4")||BLOC_DEFAULTS[3]}</div></div>
          <div class="bloc"><div class="bloc-title">${BLOC_ICONS[4]} ${localStorage.getItem("mois_titre5")||BLOC_DEFAULTS[4]}</div></div>
        </div>
      </div>
      <div class="bloc bloc-notes"><div class="bloc-title">Notes</div><div class="bloc-lines"></div></div>
    </div>`;

  return page;
}

/* ════════════════════════════════
   PAGE HEBDOMADAIRE (repris d'agenda.html)
════════════════════════════════ */
const DAY_NAMES = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Weekend"];

function buildWeekInfoPage(monday, zone, holidayMap, vacRanges) {
  const isoWeek = getISOWeek(monday);
  const page = document.createElement("div");
  page.className = "page left-page";
  applyWeekTheme(page, isoWeek);

  const titre1 = localStorage.getItem("bloc_titre1") || "Orga";
  const titre2 = localStorage.getItem("bloc_titre2") || "Équipe";

  page.innerHTML = `
    <div class="top-section">
      <div class="block calendar-block">
        <div class="block-title"></div>
        <div class="week-cal"></div>
      </div>
      <div class="block semaine-block">
        <div class="block-title"></div>
        <div class="write-lines"></div>
      </div>
    </div>
    <div class="middle-section">
      <div class="block todo-block">
        <div class="block-title">Todo</div>
        <div class="todo-lines">${Array.from({length:8}).map(() => `<div class="todo-line"><div class="checkbox"></div><div></div></div>`).join("")}</div>
      </div>
      <div class="themes-block">
        <div class="block theme-box"><div class="block-title small-title">${titre1}</div><div class="write-lines"></div></div>
        <div class="block theme-box"><div class="block-title small-title">${titre2}</div><div class="write-lines"></div></div>
      </div>
    </div>
    <div class="bottom-section">
      <div class="pensees"><div class="block-title">Pensées</div><div class="pensees-lines"></div></div>
    </div>`;

  /* Mini calendrier (mois du jeudi de la semaine) */
  const thursday = new Date(monday);
  thursday.setDate(thursday.getDate() + 3);
  const year  = thursday.getFullYear();
  const month = thursday.getMonth();
  const lastDay  = new Date(year, month + 1, 0);
  const startDay = (new Date(year, month, 1).getDay() + 6) % 7;

  page.querySelectorAll(".block-title")[0].textContent = MONTHS_FR[month];
  page.querySelectorAll(".block-title")[1].textContent = `Semaine ${isoWeek} ${thursday.getFullYear()}`;

  const cal = page.querySelector(".week-cal");
  cal.style.gridTemplateColumns = "min-content repeat(7, 1fr)";
  const emptyHeader = document.createElement("div");
  emptyHeader.innerHTML = "&nbsp;";
  cal.appendChild(emptyHeader);
  DAYS_SHORT.forEach((d, i) => {
    const h = document.createElement("div");
    h.className = "dow" + (i === 4 ? " weekday-last" : "");
    h.textContent = d;
    cal.appendChild(h);
  });

  let day = 1 - startDay;
  while (day <= lastDay.getDate()) {
    const refDay  = day < 1 ? 1 : day;
    const wNum = document.createElement("div");
    wNum.className = "week-num";
    wNum.textContent = getISOWeek(new Date(year, month, refDay));
    cal.appendChild(wNum);
    for (let col = 0; col < 7; col++, day++) {
      const div = document.createElement("div");
      if (day < 1 || day > lastDay.getDate()) {
        div.innerHTML = "&nbsp;";
      } else {
        const current = new Date(year, month, day);
        const dk = dateKey(year, month, day);
        div.textContent = day;
        if (getISOWeek(current) === isoWeek) div.classList.add("active-week");
        if (col === 4) div.classList.add("weekday-last");
        if (holidayMap.has(dk)) {
          div.classList.add("jour-ferie");
        } else if (zone !== 'none' && isVacance(current, vacRanges)) {
          div.classList.add("vacance");
        }
      }
      cal.appendChild(div);
    }
  }

  return page;
}

function buildWeekDaysPage(monday) {
  const isoWeek = getISOWeek(monday);
  const page = document.createElement("div");
  page.className = "page right-page";
  applyWeekTheme(page, isoWeek);

  DAY_NAMES.forEach((name, i) => {
    const block = document.createElement("div");
    block.className = "block day-block";

    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    let dateLabel, dk, ferieLabel = "";
    if (i === 5) {
      const sun = new Date(monday); sun.setDate(sun.getDate() + 6);
      dateLabel = `${d.getDate()} - ${sun.getDate()}/${sun.getMonth() + 1}`;
    } else {
      dateLabel = `${d.getDate()}/${d.getMonth() + 1}`;
      dk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const hols = new Map([...getHolidayMap(d.getFullYear()), ...getHolidayMap(d.getFullYear()+1)]);
      if (hols.has(dk)) ferieLabel = hols.get(dk);
    }

    block.innerHTML = `
      <div class="day-header">
        <span class="day-name">${name}</span>
        <span class="day-ferie-lbl">${ferieLabel}</span>
        <span class="date">${dateLabel}</span>
      </div>
      <div class="day-content"></div>`;
    page.appendChild(block);
  });

  return page;
}

/* ════════════════════════════════
   CONSTRUCTION COMPLÈTE
════════════════════════════════ */
async function build() {
  const val = document.getElementById("moisPicker").value;
  if (!val) return;
  const [y, m] = val.split("-");
  const year = parseInt(y), month = parseInt(m) - 1;
  const zone = document.getElementById("zonePicker").value;

  const holidayMap = new Map([...getHolidayMap(year), ...getHolidayMap(year+1)]);
  const vacRanges  = zone !== 'none' ? await fetchVacances(zone) : [];
  const weeks = weeksOfMonth(year, month);

  const output = document.getElementById("output");
  output.innerHTML = "";
  output.appendChild(buildMonthCalendarPage(year, month, zone, holidayMap, vacRanges));
  output.appendChild(buildMonthNotesPage(year, month));
  weeks.forEach(monday => {
    output.appendChild(buildWeekInfoPage(monday, zone, holidayMap, vacRanges));
    output.appendChild(buildWeekDaysPage(monday));
  });
}

document.getElementById("moisPicker").addEventListener("change", build);
document.getElementById("zonePicker").addEventListener("change", build);

const urlParams = new URLSearchParams(window.location.search);
const now = new Date();
document.getElementById("moisPicker").value =
  urlParams.get("mois") || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
if (urlParams.get("zone")) document.getElementById("zonePicker").value = urlParams.get("zone");
build();
</script>
